name: Continuous Integration

# Pull requests run CI directly. On main, CI is called by the deploy
# workflow, so nothing is published or deployed before every check has passed.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    # Same engine as Supabase: the app is tested against a real PostgreSQL
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agrofarm
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: agrofarm
      DB_USER: postgres
      DB_PASS: postgres
      DB_SSLMODE: disable
      PGPASSWORD: postgres
      BASE_URL: http://127.0.0.1:8080

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for the secret scan

      # --- DevSecOps: no keys or passwords may enter the repository
      - name: Scan for Leaked Secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP Runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, pdo_sqlite, curl, fileinfo
          tools: composer:v2
          coverage: none

      - name: Install PHP Dev Tools
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run Static Analysis & Unit Tests
        run: |
          composer lint
          vendor/bin/phpstan analyse --no-progress -c phpstan.neon
          vendor/bin/phpstan analyse --no-progress -c phpstan-lib.neon
          composer test

      - name: Check PHP Dependencies for Known Vulnerabilities
        run: composer audit --no-interaction

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/requirements.txt

      - name: Lint Python Analytics Scripts
        run: |
          pip install ruff
          ruff check tools/

      # --- Integration: the real app on a real PostgreSQL, loaded with the Supabase script
      - name: Load the Database (database/supabase.sql)
        run: psql -h 127.0.0.1 -U postgres -d agrofarm -v ON_ERROR_STOP=1 -q -f database/supabase.sql

      - name: Start the Application
        run: |
          php -S 127.0.0.1:8080 > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS "$BASE_URL/health.php?probe=ready" && exit 0; sleep 1; done
          cat /tmp/php-server.log; exit 1

      - name: Run Integration Smoke Tests (pages, login, CSRF, write round-trip)
        run: tests/integration/smoke.sh

      - name: Run the Herd Analytics Script Against the Database
        run: |
          pip install -r tools/requirements.txt
          python tools/previsao_ia.py
          python -c "import json; d=json.load(open('tools/ai_analysis.json')); assert d['metadata']['total_analyzed'] > 0; print(d['herd_summary'])"

      # --- End-to-end tests in a real browser, desktop and mobile, with an axe scan
      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            e2e/package-lock.json
            cdk/package-lock.json

      - name: Install Browser for End-to-End Tests
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run End-to-End Tests (desktop and mobile, axe accessibility scan)
        working-directory: e2e
        run: |
          # the smoke test made a failed login on purpose; reset the lockout counter
          psql -h 127.0.0.1 -U postgres -d agrofarm -c "DELETE FROM login_attempts"
          npx playwright test

      - name: Keep the Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Show the PHP Server Log
        if: failure()
        run: cat /tmp/php-server.log || true

      # --- Infrastructure as code: cost guardrails are tests
      - name: Install CDK Dependencies
        working-directory: cdk
        run: npm ci

      - name: Test Infrastructure (CDK assertions, zero-cost guardrails)
        working-directory: cdk
        run: |
          npx tsc
          npm test
