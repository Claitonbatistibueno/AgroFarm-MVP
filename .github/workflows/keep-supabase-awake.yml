name: Keep Supabase Awake

# Supabase pauses free projects after 7 days without activity.
# A tiny query every 3 days keeps the database available. Runs only when
# the DB secrets exist; costs nothing (GitHub Actions minutes are free on public repos).
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          PGHOST: ${{ secrets.DB_HOST }}
          PGPORT: ${{ secrets.DB_PORT }}
          PGDATABASE: ${{ secrets.DB_NAME }}
          PGUSER: ${{ secrets.DB_USER }}
          PGPASSWORD: ${{ secrets.DB_PASS }}
          PGSSLMODE: require
        run: |
          if [ -z "$PGHOST" ]; then echo "DB secrets not set yet, skipping"; exit 0; fi
          psql -tAc "SELECT 'animals: ' || COUNT(*) FROM animal"
